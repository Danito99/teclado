<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A teclear: juego del teclado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DCE8E1; --surface:#F5FAF7; --ink:#15302A; --muted:#4F6D63; --line:#BFD2C8;
  --deck:#C3D5CB; --key:#FFFFFF; --key-edge:#98B2A5; --paper:#FFFFFF; --rule:#D5E4F0; --margin:#F0A3A3;
  --target:#F2B705; --ok:#1E9A58; --bad:#D6442E;
  --team0:#2E7BCB; --team1:#E0712A;
  --pinky:#E0659A; --ring:#F29B38; --middle:#4DB36A; --index:#3E8FD8; --thumb:#9A8FB0;
  --ui:'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --read:'Andika', 'Lexend', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12261F; --surface:#1A352D; --ink:#E7F1EC; --muted:#9BB8AD; --line:#34574C;
    --deck:#0C1C17; --key:#264840; --key-edge:#07130F; --paper:#1D3A32; --rule:#2B4B42; --margin:#8C4B4B;
  }
}
:root[data-theme="dark"]{
  --bg:#12261F; --surface:#1A352D; --ink:#E7F1EC; --muted:#9BB8AD; --line:#34574C;
  --deck:#0C1C17; --key:#264840; --key-edge:#07130F; --paper:#1D3A32; --rule:#2B4B42; --margin:#8C4B4B;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;display:grid;grid-template-rows:auto 1fr auto;
  background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--target);outline-offset:2px}

/* Barra superior */
.top{display:flex;align-items:center;gap:12px 16px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.cap{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--key);box-shadow:0 4px 0 var(--key-edge);font-family:var(--read);font-weight:700;font-size:20px;transform:translateY(-2px)}
.modes{display:flex;gap:4px;background:var(--surface);padding:5px;border-radius:16px;overflow-x:auto;max-width:100%}
.modes button{border:0;background:transparent;padding:0 14px;min-height:48px;border-radius:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.score{display:flex;gap:8px;align-items:center}
.chip,.team{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:14px;background:var(--surface);font-size:15px;color:var(--muted);min-height:48px}
.chip b,.team b{font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.team{border:3px solid transparent;color:var(--ink);font-weight:600}
.team.now{border-color:var(--tc)}
.team .dot{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.tools{display:flex;gap:6px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;min-height:48px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Escenario */
.stage{min-height:0;display:grid;place-items:center;padding:8px 20px;overflow:hidden}
.play{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,16px);text-align:center}
.play.yay{animation:yay .5s ease}
.prompt{margin:0;font-size:clamp(20px,3.2vh,32px);color:var(--muted);font-weight:600}
.glyph{font-family:var(--read);font-weight:700;font-size:clamp(80px,22vh,240px);line-height:1}
.glyph .lower{font-size:.42em;color:var(--muted);margin-left:.18em;font-weight:400}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.progress{margin:0;color:var(--muted);font-size:clamp(15px,2vh,20px);font-variant-numeric:tabular-nums}
.turn{background:var(--tc);color:#fff;padding:8px 20px;border-radius:999px;font-weight:700;font-size:clamp(16px,2.4vh,24px)}
.emoji{font-size:clamp(60px,15vh,150px);line-height:1}
.slots{display:flex;gap:clamp(4px,.8vw,12px);flex-wrap:wrap;justify-content:center}
.slot{font-family:var(--read);font-weight:700;font-size:clamp(34px,8vh,84px);line-height:1.15;min-width:.8em;text-align:center;border-bottom:6px solid var(--line);color:color-mix(in srgb,var(--ink) 25%,transparent)}
.slot.filled{color:var(--ok);border-color:var(--ok)}
.slot.next{border-color:var(--target);color:var(--ink)}
.question{margin:0;font-size:clamp(22px,4vh,42px);font-weight:600;max-width:26ch;text-wrap:balance;line-height:1.25}
.demo{display:flex;align-items:center;gap:.6em;font-family:var(--read);font-size:clamp(26px,5vh,54px);flex-wrap:wrap;justify-content:center}
.demo .before{color:var(--muted)}
.demo svg{width:1em;height:1em;flex:none;color:var(--muted)}
.demo .box{background:var(--surface);padding:.15em .5em;border-radius:14px;line-height:1.2;text-align:left}
.field{display:inline-block;border:3px solid var(--line);border-radius:8px;padding:.05em .35em;font-size:.6em;margin:.1em}
.field.on{border-color:var(--target)}
.bar{display:inline-block;width:3px;height:1em;background:var(--ink);vertical-align:-.12em;margin-left:1px}

/* Explorar */
.explore{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:clamp(12px,2vw,28px);width:min(100%,1300px);height:100%;max-height:100%;align-items:stretch}
.bigcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px}
.bigcard .glyph{font-size:clamp(70px,19vh,200px)}
.bigcard .glyph.sym{font-size:clamp(56px,13vh,140px)}
.caption{font-weight:700;font-size:clamp(18px,2.6vh,28px)}
.finger{margin:0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:clamp(15px,2.1vh,21px);max-width:22ch;text-wrap:balance;justify-content:center}
.finger i{width:16px;height:16px;border-radius:50%;background:var(--fc);flex:none}
.paper{position:relative;background:var(--paper);border-radius:18px;padding:14px 18px 14px 56px;display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 0 var(--line)}
.paper::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:var(--margin)}
.ptext{flex:1;min-height:0;overflow:auto;font-family:var(--read);font-size:clamp(24px,4.2vh,44px);line-height:1.5;white-space:pre-wrap;word-break:break-word;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.5em - 2px),var(--rule) calc(1.5em - 2px),var(--rule) 1.5em);background-attachment:local}
.ptext .ph{color:var(--muted);font-family:var(--ui);font-size:.55em}
.caret{display:inline-block;width:3px;height:1.05em;background:var(--ink);vertical-align:-.15em;animation:blink 1s steps(1) infinite}
.paper .btn{align-self:flex-end;margin-top:8px}

/* Teclado */
.deck{padding:0 clamp(8px,1.5vw,20px) clamp(8px,1.5vh,16px)}
.kb{--g:clamp(4px,.55vw,8px);--kh:clamp(40px,8.2vh,88px);display:flex;flex-direction:column;gap:var(--g);width:min(100%,1500px);margin:0 auto;background:var(--deck);padding:clamp(8px,1.2vw,16px);border-radius:24px}
.row{display:flex;gap:var(--g)}
.row.spacebar{justify-content:center}
.key{
  position:relative;flex:0 0 calc((100% - 13 * var(--g)) / 14 * var(--w) + var(--g) * (var(--w) - 1));
  height:var(--kh);border:0;border-radius:clamp(6px,.8vw,12px);background:var(--key);color:var(--ink);
  box-shadow:0 5px 0 var(--key-edge);margin-bottom:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--read);font-weight:700;font-size:calc(var(--kh) * .42);line-height:1;padding:2px;
  transition:transform .06s,box-shadow .06s,background-color .15s;touch-action:manipulation;
}
.zones .key{background:color-mix(in srgb,var(--f) 34%,var(--key))}
.key .ico{font-size:calc(var(--kh) * .32)}
.key .lbl{font-family:var(--ui);font-weight:600;font-size:max(10px,calc(var(--kh) * .17));text-align:center}
.key.bump::after{content:"";position:absolute;bottom:16%;left:38%;width:24%;height:3px;border-radius:2px;background:currentColor;opacity:.45}
.key.down{transform:translateY(4px);box-shadow:0 1px 0 var(--key-edge)}
.kb .key.on{background:var(--ink);color:var(--bg)}
.kb .key.ok{background:var(--ok);color:#fff}
.kb .key.bad{background:var(--bad);color:#fff;animation:shake .35s}
.key.hint{outline:5px solid var(--target);outline-offset:2px;animation:pulse 1.1s ease-out infinite;z-index:1}
.legend{display:none;justify-content:center;gap:8px 16px;flex-wrap:wrap;padding-top:8px;font-size:14px;color:var(--muted)}
.zones .legend{display:flex}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--c)}

/* Final de ronda */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);z-index:10;padding:20px}
.overlay[hidden]{display:none}
.card{background:var(--surface);border-radius:24px;padding:28px 32px;text-align:center;max-width:520px;box-shadow:0 8px 0 var(--line)}
.card h2{margin:0 0 6px;font-size:34px}
.card p{margin:0 0 20px;font-size:20px;color:var(--muted)}
.card .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* Ajustes */
dialog{border:0;border-radius:22px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.set{padding:22px 24px;display:flex;flex-direction:column;gap:16px;-webkit-user-select:text;user-select:text}
.set h2{margin:0;font-size:24px}
.set label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
.set select,.set input[type=text],.set textarea{font:inherit;font-weight:400;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.set small{font-weight:400;color:var(--muted)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks label{display:flex;align-items:center;gap:10px;min-height:44px}
.checks input{width:22px;height:22px;accent-color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names[hidden]{display:none}
.actions{display:flex;justify-content:flex-end;gap:10px}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes yay{40%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@keyframes pulse{0%{box-shadow:0 5px 0 var(--key-edge),0 0 0 0 color-mix(in srgb,var(--target) 70%,transparent)}100%{box-shadow:0 5px 0 var(--key-edge),0 0 0 16px transparent}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .pop,.play.yay,.key.bad,.key.hint,.caret{animation:none}
}
@media (max-width:760px){
  .explore{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .bigcard{flex-direction:row;padding:4px}
  .checks,.names{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1><span class="cap">A</span> teclear</h1></div>
  <nav class="modes" role="tablist" aria-label="Juegos">
    <button role="tab" data-mode="explorar">🔍 Explorar</button>
    <button role="tab" data-mode="letra">🎯 Encuentra la letra</button>
    <button role="tab" data-mode="palabra">✍️ Escribe la palabra</button>
    <button role="tab" data-mode="especiales">⭐ Teclas especiales</button>
  </nav>
  <div class="score" id="score" aria-live="polite"></div>
  <div class="tools">
    <button class="btn" id="btnSettings">Ajustes</button>
    <button class="btn" id="btnFull" hidden>Pantalla completa</button>
  </div>
</header>

<main class="stage" id="stage"></main>

<section class="deck" aria-label="Teclado">
  <div class="kb" id="kb"></div>
  <div class="legend" aria-hidden="true">
    <span style="--c:var(--pinky)"><i></i>Meñique</span>
    <span style="--c:var(--ring)"><i></i>Anular</span>
    <span style="--c:var(--middle)"><i></i>Medio</span>
    <span style="--c:var(--index)"><i></i>Índice</span>
    <span style="--c:var(--thumb)"><i></i>Pulgar</span>
  </div>
</section>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="endTitle">
    <h2 id="endTitle">¡Ronda terminada!</h2>
    <p id="endText"></p>
    <div class="row2">
      <button class="btn primary" id="again">Jugar otra vez</button>
      <button class="btn" id="toExplore">Volver a explorar</button>
    </div>
  </div>
</div>

<dialog id="settings">
  <form method="dialog" class="set">
    <h2>Ajustes</h2>
    <label class="f">Nivel
      <select id="sLevel">
        <option value="0">Inicial: fila guía (A S D F…) y palabras cortas</option>
        <option value="1">Intermedio: todas las letras</option>
        <option value="2">Avanzado: letras, números y palabras largas</option>
      </select>
    </label>
    <div class="checks">
      <label><input type="checkbox" id="sHints"> Iluminar la tecla si tardan</label>
      <label><input type="checkbox" id="sZones"> Colores por dedo</label>
      <label><input type="checkbox" id="sVoice"> Voz</label>
      <label><input type="checkbox" id="sSound"> Sonidos</label>
      <label><input type="checkbox" id="sTeams"> Jugar por equipos</label>
    </div>
    <div class="names" id="names">
      <label class="f">Equipo 1<input type="text" id="sT0" maxlength="20"></label>
      <label class="f">Equipo 2<input type="text" id="sT1" maxlength="20"></label>
    </div>
    <label class="f">Tus palabras, separadas por comas
      <textarea id="sWords" rows="2" placeholder="escuela, maestra, recreo"></textarea>
      <small>Si escribes palabras aquí, “Escribe la palabra” usa estas en lugar de la lista incluida. Los acentos se quitan; los espacios se escriben con la barra espaciadora.</small>
    </label>
    <div class="actions">
      <button class="btn" value="cancel">Cancelar</button>
      <button class="btn primary" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<canvas id="fx"></canvas>

<script>
(() => {
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const DEFAULTS = {level:1, hints:true, zones:false, voice:true, sound:true, teams:false, names:['Equipo Sol','Equipo Luna'], custom:''};
let cfg = Object.assign({}, DEFAULTS, store.get('a-teclear-cfg', {}));

/* ---------- Teclado latinoamericano ---------- */
const S = (id, w, label, icon) => ({id, w, label, icon});
const ROWS = [
  [...'1234567890', "'", '¿', S('BORRAR', 2, 'Borrar', '⌫')],
  [S('TAB', 2, 'Tab', '⇥'), ...'QWERTYUIOP', '´', '+'],
  [S('CAPS', 2.25, 'Bloq Mayús', '⇪'), ...'ASDFGHJKLÑ', S('ENTER', 1.75, 'Enter', '⏎')],
  [S('SHIFT_L', 2.75, 'Shift', '⇧'), ...'ZXCVBNM', ',', '.', '-', S('SHIFT_R', 1.25, 'Shift', '⇧')],
  [S('SPACE', 7, 'Espacio', '')]
];
const FMAP = {
  L5:['1','Q','A','Z','TAB','CAPS','SHIFT_L'], L4:['2','W','S','X'], L3:['3','E','D','C'],
  L2:['4','5','R','T','F','G','V','B'], R2:['6','7','Y','U','H','J','N','M'],
  R3:['8','I','K',','], R4:['9','O','L','.'],
  R5:['0',"'",'¿','P','´','+','Ñ','-','BORRAR','ENTER','SHIFT_R'], T:['SPACE']
};
const FINFO = {
  L5:['meñique izquierdo','--pinky'], L4:['anular izquierdo','--ring'], L3:['medio izquierdo','--middle'],
  L2:['índice izquierdo','--index'], R2:['índice derecho','--index'], R3:['medio derecho','--middle'],
  R4:['anular derecho','--ring'], R5:['meñique derecho','--pinky'], T:['pulgar','--thumb']
};
const FINGER = {};
for (const [f, ids] of Object.entries(FMAP)) ids.forEach(id => FINGER[id] = f);

const NAMES = {A:'a',B:'be',C:'ce',D:'de',E:'e',F:'efe',G:'ge',H:'hache',I:'i',J:'jota',K:'ka',L:'ele',M:'eme',N:'ene','Ñ':'eñe',O:'o',P:'pe',Q:'cu',R:'erre',S:'ese',T:'te',U:'u',V:'ve',W:'doble ve',X:'equis',Y:'ye',Z:'zeta',
  '1':'uno','2':'dos','3':'tres','4':'cuatro','5':'cinco','6':'seis','7':'siete','8':'ocho','9':'nueve','0':'cero'};
const PHRASE = {"'":'el apóstrofo','¿':'el signo de interrogación','´':'el acento','+':'el signo más',',':'la coma','.':'el punto','-':'el guion',
  BORRAR:'la tecla Borrar',TAB:'la tecla Tab',CAPS:'la tecla Bloq Mayús',ENTER:'la tecla Enter',SHIFT_L:'la tecla Shift',SHIFT_R:'la tecla Shift',SPACE:'la barra espaciadora'};
const phrase = id => PHRASE[id] || (/^\d$/.test(id) ? `el número ${NAMES[id]}` : `la ${NAMES[id] || id}`);
const GLYPH = {BORRAR:'⌫',TAB:'⇥',CAPS:'⇪',ENTER:'⏎',SHIFT_L:'⇧',SHIFT_R:'⇧',SPACE:'␣'};
const LABEL = {BORRAR:'Borrar',TAB:'Tab',CAPS:'Bloq Mayús',ENTER:'Enter',SHIFT_L:'Shift',SHIFT_R:'Shift',SPACE:'Barra espaciadora'};
const DOES = {BORRAR:'borra la letra de atrás',TAB:'salta a la siguiente casilla',CAPS:'escribe todo en mayúsculas',ENTER:'baja a la siguiente línea',SHIFT_L:'escribe una letra en mayúscula',SHIFT_R:'escribe una letra en mayúscula',SPACE:'deja un espacio entre palabras'};

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
const SPECIALS = [
  {id:'SPACE', q:'¿Qué tecla separa una palabra de otra?', a:'holamundo', b:'hola mundo'},
  {id:'BORRAR', q:'¿Qué tecla borra la letra que sobra?', a:'gatoo<span class="bar"></span>', b:'gato<span class="bar"></span>'},
  {id:'ENTER', q:'¿Qué tecla baja a la siguiente línea?', a:'hola adiós', b:'hola<br>adiós'},
  {id:'SHIFT', q:'¿Qué tecla mantienes presionada para escribir una sola mayúscula?', a:'méxico', b:'México'},
  {id:'CAPS', q:'¿Qué tecla hace que todo se escriba en mayúsculas?', a:'alto', b:'ALTO'},
  {id:'TAB', q:'¿Qué tecla salta a la siguiente casilla?', a:'<span class="field on">Nombre</span><span class="field">Edad</span>', b:'<span class="field">Nombre</span><span class="field on">Edad</span>'}
];
const WORDS = {
  cortas:[['SOL','☀️'],['MAR','🌊'],['OSO','🐻'],['PAN','🍞'],['UVA','🍇'],['PEZ','🐟'],['GATO','🐱'],['PATO','🦆'],['CASA','🏠'],['LUNA','🌙'],['TACO','🌮'],['FLOR','🌸'],['VACA','🐮'],['RANA','🐸'],['NUBE','☁️'],['TREN','🚂'],['PIÑA','🍍']],
  medianas:[['PERRO','🐶'],['FRESA','🍓'],['ABEJA','🐝'],['LIBRO','📚'],['ARAÑA','🕷️'],['COHETE','🚀'],['HELADO','🍦'],['PELOTA','⚽'],['JIRAFA','🦒'],['CONEJO','🐰'],['NARANJA','🍊']],
  largas:[['MANZANA','🍎'],['TORTUGA','🐢'],['ELEFANTE','🐘'],['CABALLO','🐴'],['ESTRELLA','⭐'],['MARIPOSA','🦋'],['DINOSAURIO','🦕'],['COCODRILO','🐊'],['GUITARRA','🎸']]
};
const PRAISE = ['¡Muy bien!','¡Excelente!','¡Eso es!','¡Bravo!','¡Genial!'];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Construir teclado ---------- */
const KEYS = {};
function buildKB(){
  const kb = $('#kb');
  ROWS.forEach((row, ri) => {
    const r = document.createElement('div');
    r.className = 'row' + (ri === 4 ? ' spacebar' : '');
    row.forEach(k => {
      const d = typeof k === 'string' ? {id:k, w:1} : k;
      const b = document.createElement('button');
      b.type = 'button'; b.tabIndex = -1; b.className = 'key' + (d.label ? ' special' : '');
      b.style.setProperty('--w', d.w);
      b.style.setProperty('--f', `var(${FINFO[FINGER[d.id]][1]})`);
      if (d.id === 'F' || d.id === 'J') b.classList.add('bump');
      b.setAttribute('aria-label', d.label || d.id);
      b.innerHTML = d.label
        ? `${d.icon ? `<span class="ico" aria-hidden="true">${d.icon}</span>` : ''}<span class="lbl">${d.label}</span>`
        : `<span>${esc(d.id)}</span>`;
      b.addEventListener('pointerdown', e => { e.preventDefault(); press(d.id); });
      KEYS[d.id] = b; r.appendChild(b);
    });
    kb.appendChild(r);
  });
}

/* ---------- Sonido y voz ---------- */
let AC;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type = 'sine', vol = .08, delay = 0){
  if (!cfg.sound) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const tick = () => tone(880, .04, 'square', .018);
const good = () => { tone(660, .12, 'triangle', .1); tone(990, .18, 'triangle', .1, .1); };
const bad = () => tone(170, .22, 'sawtooth', .045);
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .09, i * .12));

let esVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find(v => /es[-_]MX/i.test(v.lang)) || vs.find(v => /^es[-_](US|419)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!cfg.voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = esVoice ? esVoice.lang : 'es-MX'; if (esVoice) u.voice = esVoice; u.rate = .95;
  speechSynthesis.speak(u);
}

/* ---------- Efectos en teclas ---------- */
function flash(id){ const k = KEYS[id]; if (!k) return; k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 130); }
function mark(id, cls, ms){ const k = KEYS[id]; if (!k) return; k.classList.remove(cls); void k.offsetWidth; k.classList.add(cls); setTimeout(() => k.classList.remove(cls), ms); }

/* ---------- Estado ---------- */
let mode = 'explorar', R = null, hintT = null;
const E = {text:'', shift:false, caps:false, dead:false, last:null};

function press(id){
  ac(); flash(id); tick();
  if (mode === 'explorar') return explore(id);
  if (!R || R.done || R.lock) return;
  if (mode === 'letra') return checkLetter(id);
  if (mode === 'palabra') return checkWord(id);
  if (mode === 'especiales') return checkSpecial(id);
}

/* ---------- Explorar ---------- */
const ACC = {A:'Á',E:'É',I:'Í',O:'Ó',U:'Ú'};
function explore(id){
  let spoken = NAMES[id] || (PHRASE[id] || id).replace(/^(la tecla |la |el )/, '');
  let shown = null;
  if (id === 'SHIFT_L' || id === 'SHIFT_R') { E.shift = !E.shift; spoken = E.shift ? 'Shift: la siguiente letra va en mayúscula' : 'Shift apagado'; }
  else if (id === 'CAPS') { E.caps = !E.caps; spoken = E.caps ? 'Mayúsculas activadas' : 'Mayúsculas desactivadas'; }
  else if (id === 'BORRAR') { E.text = E.text.slice(0, -1); }
  else if (id === 'ENTER') { E.text += '\n'; }
  else if (id === 'TAB') { E.text += '    '; }
  else if (id === 'SPACE') { E.text += ' '; }
  else if (id === '´') { E.dead = true; spoken = 'Acento: ahora toca una vocal'; }
  else {
    let ch = id; const upper = E.caps !== E.shift;
    if (E.dead) { E.dead = false; if (ACC[ch]) { ch = ACC[ch]; spoken = NAMES[id] + ' con acento'; } else E.text += '´'; }
    ch = upper ? ch : ch.toLowerCase();
    E.text += ch; shown = ch; E.shift = false;
  }
  E.last = {id, shown};
  renderExplore(); syncToggles(); say(spoken);
}
function syncToggles(){
  const on = mode === 'explorar';
  KEYS.SHIFT_L.classList.toggle('on', on && E.shift);
  KEYS.SHIFT_R.classList.toggle('on', on && E.shift);
  KEYS.CAPS.classList.toggle('on', on && E.caps);
  KEYS['´'].classList.toggle('on', on && E.dead);
}
function fingerLine(id){
  const f = FINFO[FINGER[id]];
  return `<p class="finger"><i style="--fc:var(${f[1]})"></i>Se toca con el dedo ${f[0]}</p>`;
}
function renderExplore(){
  const L = E.last;
  let big;
  if (!L) big = `<div class="glyph sym">👆</div><p class="finger">Toca cualquier tecla para descubrirla</p>`;
  else if (GLYPH[L.id]) big = `<div class="glyph sym pop">${GLYPH[L.id]}</div><div class="caption">${LABEL[L.id]}</div>${fingerLine(L.id)}`;
  else if (L.id === '´') big = `<div class="glyph pop">´</div><div class="caption">Acento</div>${fingerLine(L.id)}`;
  else big = `<div class="glyph pop">${esc(L.shown)}</div>${fingerLine(L.id)}`;
  const txt = E.text ? esc(E.text) : '<span class="ph">Aquí aparece lo que escriben. </span>';
  $('#stage').innerHTML = `<div class="explore">
      <div class="bigcard">${big}</div>
      <div class="paper"><div class="ptext" id="ptext">${txt}<span class="caret"></span></div>
      <button class="btn" id="clr" type="button">Borrar todo</button></div></div>`;
  const p = $('#ptext'); p.scrollTop = p.scrollHeight;
  $('#clr').onclick = () => { E.text = ''; renderExplore(); };
}

/* ---------- Rondas ---------- */
function letterPool(){
  const L = [...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'];
  if (cfg.level === 0) return [...'ASDFGHJKLÑ'];
  if (cfg.level === 1) return L;
  return L.concat([...'0123456789']);
}
function cleanWord(w){
  return w.trim().toUpperCase().replace(/Ñ/g, '\u0001').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\u0001/g, 'Ñ').replace(/[^A-ZÑ0-9 ]/g, '').replace(/\s+/g, ' ').trim();
}
function wordPool(){
  const custom = cfg.custom.split(',').map(cleanWord).filter(Boolean);
  if (custom.length) return custom.map(w => [w, '✏️']);
  if (cfg.level === 0) return WORDS.cortas.slice();
  if (cfg.level === 1) return WORDS.cortas.concat(WORDS.medianas);
  return WORDS.medianas.concat(WORDS.largas);
}
function newRound(){
  hideOverlay(); clearHint();
  R = {i:0, scores:[0,0], turn:0, streak:0, firstTry:0, erred:false, pos:0, done:false, lock:false, items:[]};
  if (mode === 'letra') { const p = letterPool(); let prev = null; for (let n = 0; n < 10; n++) { let c; do { c = p[Math.floor(Math.random() * p.length)]; } while (c === prev); R.items.push(c); prev = c; } }
  if (mode === 'palabra') R.items = shuffle(wordPool()).slice(0, 6);
  if (mode === 'especiales') R.items = shuffle(SPECIALS.slice());
  startItem();
}
function startItem(){
  R.erred = false; R.pos = 0; R.lock = false; clearHint();
  render(true); renderScore();
  const it = R.items[R.i];
  if (mode === 'letra') say(`Busca ${phrase(it)}`);
  if (mode === 'palabra') say(`Escribe: ${it[0].toLowerCase()}`);
  if (mode === 'especiales') say(it.q);
  armHint();
}
function expected(){
  const it = R.items[R.i];
  if (mode === 'letra') return [it];
  if (mode === 'palabra') { const c = it[0][R.pos]; return [c === ' ' ? 'SPACE' : c]; }
  if (mode === 'especiales') return it.id === 'SHIFT' ? ['SHIFT_L','SHIFT_R'] : [it.id];
  return [];
}
function armHint(delay){
  clearTimeout(hintT);
  if (!cfg.hints) return;
  hintT = setTimeout(() => expected().forEach(id => KEYS[id] && KEYS[id].classList.add('hint')), delay ?? (mode === 'especiales' ? 8000 : 4000));
}
function clearHint(){ clearTimeout(hintT); document.querySelectorAll('.key.hint').forEach(k => k.classList.remove('hint')); }

function miss(id, msg){
  mark(id, 'bad', 450); bad();
  R.erred = true; R.streak = 0; renderScore(); say(msg);
}
function finish(id, msg, wait = 1100){
  mark(id, 'ok', 600); good(); clearHint(); R.lock = true;
  if (!R.erred) R.firstTry++;
  R.streak++; R.scores[cfg.teams ? R.turn : 0]++;
  renderScore(); say(msg);
  const p = document.querySelector('.play');
  if (p && !reduced()) { p.classList.remove('yay'); void p.offsetWidth; p.classList.add('yay'); }
  setTimeout(() => {
    R.i++; if (cfg.teams) R.turn = 1 - R.turn;
    if (R.i >= R.items.length) endRound(); else startItem();
  }, wait);
}
function checkLetter(id){
  const t = R.items[R.i];
  if (id === t) finish(id, praise());
  else miss(id, `Esa es ${phrase(id)}. Busca ${phrase(t)}.`);
}
function checkWord(id){
  const w = R.items[R.i][0], exp = expected()[0];
  if (id === exp) {
    R.pos++; clearHint();
    if (R.pos >= w.length) { render(false); finish(id, `${w.toLowerCase()}. ${praise()}`, 1500); }
    else { mark(id, 'ok', 350); tone(620 + R.pos * 50, .08, 'triangle', .06); render(false); armHint(3000); }
  } else if (!['SHIFT_L','SHIFT_R','CAPS'].includes(id)) {
    miss(id, `Esa es ${phrase(id)}. Ahora va ${phrase(exp)}.`);
  }
}
function checkSpecial(id){
  const it = R.items[R.i];
  if (expected().includes(id)) finish(id, `${praise()} ${LABEL[id]} ${DOES[id]}.`, 2600);
  else if (DOES[id]) miss(id, `Esa es ${LABEL[id]}: ${DOES[id]}. Intenta otra vez.`);
  else miss(id, `Esa es ${phrase(id)}. Busca una tecla especial.`);
}

function turnChip(){
  if (!cfg.teams) return '';
  return `<div class="turn" style="--tc:var(--team${R.turn})">Turno de ${esc(cfg.names[R.turn])}</div>`;
}
function render(fresh){
  const it = R.items[R.i], pop = fresh ? ' pop' : '';
  let html = '';
  if (mode === 'letra') {
    const num = /^\d$/.test(it);
    html = `<p class="prompt">${num ? 'Toca el número' : 'Toca la letra'}</p>
      <div class="glyph${pop}">${esc(it)}${num ? '' : `<span class="lower">${esc(it.toLowerCase())}</span>`}</div>
      <p class="progress">${R.i + 1} de ${R.items.length}</p>`;
  } else if (mode === 'palabra') {
    const [w, emo] = it;
    const slots = [...w].map((c, i) => {
      const cls = i < R.pos ? 'filled' : (i === R.pos ? 'next' : '');
      return `<span class="slot ${cls}">${c === ' ' ? '␣' : esc(c)}</span>`;
    }).join('');
    html = `<div class="emoji${pop}" aria-hidden="true">${emo}</div>
      <div class="slots" aria-label="${esc(w)}">${slots}</div>
      <p class="progress">Palabra ${R.i + 1} de ${R.items.length}</p>`;
  } else if (mode === 'especiales') {
    html = `<p class="question${pop}">${it.q}</p>
      <div class="demo"><span class="box before">${it.a}</span>${ARROW}<span class="box after">${it.b}</span></div>
      <p class="progress">${R.i + 1} de ${R.items.length}</p>`;
  }
  $('#stage').innerHTML = `<div class="play">${turnChip()}${html}</div>`;
}
function renderScore(){
  const el = $('#score');
  if (mode === 'explorar' || !R) { el.innerHTML = ''; return; }
  if (cfg.teams) {
    el.innerHTML = [0, 1].map(t => `<div class="team ${R.turn === t && !R.done ? 'now' : ''}" style="--tc:var(--team${t})"><span class="dot"></span>${esc(cfg.names[t])} <b>${R.scores[t]}</b></div>`).join('');
  } else {
    el.innerHTML = `<div class="chip"><b>${R.scores[0]}</b> aciertos</div><div class="chip"><b>${R.streak}</b> seguidos</div>`;
  }
}
function endRound(){
  R.done = true; clearHint(); renderScore(); fanfare(); confetti();
  let text;
  const n = R.items.length;
  if (cfg.teams) {
    const [a, b] = R.scores;
    text = a === b ? `¡Empate! ${a} a ${b}. Los dos equipos lo hicieron muy bien.`
      : `Gana ${esc(cfg.names[a > b ? 0 : 1])}, ${Math.max(a, b)} a ${Math.min(a, b)}.`;
  } else {
    text = `${R.firstTry} de ${n} a la primera.`;
  }
  $('#endText').innerHTML = text;
  $('#overlay').hidden = false;
  say('¡Ronda terminada! ' + $('#endText').textContent);
  $('#again').focus();
}
function hideOverlay(){ $('#overlay').hidden = true; }

/* ---------- Confeti ---------- */
function confetti(){
  if (reduced()) return;
  const c = $('#fx'), x = c.getContext('2d'), d = devicePixelRatio || 1;
  const W = c.width = innerWidth * d, H = c.height = innerHeight * d;
  const cols = ['#E0659A','#F29B38','#4DB36A','#3E8FD8','#F2B705'];
  const P = Array.from({length:150}, () => ({x:Math.random() * W, y:-Math.random() * H * .6, vx:(Math.random() - .5) * 4 * d, vy:(2 + Math.random() * 4) * d, s:(7 + Math.random() * 8) * d, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05 * d; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (t - t0 < 2800) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

/* ---------- Modos ---------- */
function setMode(m){
  mode = m; clearHint(); hideOverlay();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  if (m === 'explorar') { R = null; renderExplore(); renderScore(); }
  else newRound();
  syncToggles();
}
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#again').onclick = newRound;
$('#toExplore').onclick = () => setMode('explorar');

/* ---------- Teclado físico ---------- */
function idFromEvent(e){
  const k = e.key;
  if (k === ' ') return 'SPACE';
  if (k === 'Backspace') return 'BORRAR';
  if (k === 'Tab') return 'TAB';
  if (k === 'CapsLock') return 'CAPS';
  if (k === 'Enter') return 'ENTER';
  if (k === 'Shift') return e.code === 'ShiftRight' ? 'SHIFT_R' : 'SHIFT_L';
  if (k === 'Dead' || k === '´') return '´';
  if (k.length === 1) {
    const u = k.toUpperCase();
    if (KEYS[u]) return u;
    const base = u.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (KEYS[base]) return base;
  }
  return null;
}
document.addEventListener('keydown', e => {
  if ($('#settings').open || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('#overlay').hidden && (e.key === 'Enter' || e.key === ' ')) return;
  const id = idFromEvent(e); if (!id) return;
  e.preventDefault();
  if (e.repeat && (id.startsWith('SHIFT') || id === 'CAPS')) return;
  press(id);
});

/* ---------- Ajustes ---------- */
function applyCfg(){ document.body.classList.toggle('zones', cfg.zones); }
const dlg = $('#settings');
$('#btnSettings').onclick = () => {
  $('#sLevel').value = cfg.level; $('#sHints').checked = cfg.hints; $('#sZones').checked = cfg.zones;
  $('#sVoice').checked = cfg.voice; $('#sSound').checked = cfg.sound; $('#sTeams').checked = cfg.teams;
  $('#sT0').value = cfg.names[0]; $('#sT1').value = cfg.names[1]; $('#sWords').value = cfg.custom;
  $('#names').hidden = !cfg.teams;
  dlg.showModal();
};
$('#sTeams').onchange = e => { $('#names').hidden = !e.target.checked; };
dlg.addEventListener('close', () => {
  if (dlg.returnValue !== 'ok') return;
  const before = JSON.stringify([cfg.level, cfg.teams, cfg.custom]);
  cfg.level = +$('#sLevel').value; cfg.hints = $('#sHints').checked; cfg.zones = $('#sZones').checked;
  cfg.voice = $('#sVoice').checked; cfg.sound = $('#sSound').checked; cfg.teams = $('#sTeams').checked;
  cfg.names = [$('#sT0').value.trim() || DEFAULTS.names[0], $('#sT1').value.trim() || DEFAULTS.names[1]];
  cfg.custom = $('#sWords').value;
  store.set('a-teclear-cfg', cfg); applyCfg();
  if (!cfg.voice && 'speechSynthesis' in window) speechSynthesis.cancel();
  if (mode !== 'explorar') {
    if (JSON.stringify([cfg.level, cfg.teams, cfg.custom]) !== before) newRound();
    else { clearHint(); if (!R.done && !R.lock) armHint(); render(false); renderScore(); }
  }
});

/* ---------- Pantalla completa ---------- */
const fullBtn = $('#btnFull');
if (document.fullscreenEnabled) {
  fullBtn.hidden = false;
  fullBtn.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener('fullscreenchange', () => {
    fullBtn.textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa';
  });
}

buildKB(); applyCfg(); setMode('explorar');
})();
</script>
</body>
